services:
  - type: web
    name: litpulse-os
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PG_LOCAL_BACKUP
        value: "true"
      - key: HUBSPOT_ACCESS_TOKEN
        sync: false
      - key: QUICKBOOKS_ENVIRONMENT
        sync: false
      - key: QUICKBOOKS_CLIENT_ID
        sync: false
      - key: QUICKBOOKS_CLIENT_SECRET
        sync: false
      - key: QUICKBOOKS_REALM_ID
        sync: false
      - key: QUICKBOOKS_REFRESH_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
